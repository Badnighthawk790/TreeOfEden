name: Build macOS app

# Builds, tests and packages SteamXBridge.app on Apple Silicon for every push.
# The SwiftUI app can only be compiled on macOS; the packaged app is uploaded
# as a downloadable artifact. (Same-repo pull requests are covered by the push
# to their branch, so there is no separate pull_request trigger to run twice.)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26 # Apple Silicon; macos-14 is retired on 2026-11-02
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Run tests
        run: swift test

      - name: Package .app bundle
        run: ./scripts/package_macos_app.sh

      - name: Install the bundled runtime the way the app does
        env:
          SXB_RUNTIME_SOURCE: dist/SteamXBridge.app/Contents/Resources/Runtime
        run: swift test --filter RuntimeInstallerTests/testInstallsTheRealRuntime

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: SteamXBridge-macOS
          path: dist/SteamXBridge-macOS.zip
          if-no-files-found: error

      # From here on the build is checked the way a user meets it: the app is
      # started, and the bundled engine runs real Windows programs.
      - name: Launch the packaged app (first-launch setup)
        run: ./scripts/ci_launch_app.sh

      - name: Upload first-launch screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: first-launch-screenshot
          path: ${{ runner.temp }}/steamxbridge-first-launch.png
          if-no-files-found: ignore

      - name: Ensure Rosetta 2
        run: |
          if [ ! -e /Library/Apple/usr/libexec/oah/libRosettaRuntime ]; then
            softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Build the Direct3D 11 probe
        run: |
          brew install mingw-w64
          x86_64-w64-mingw32-gcc -O2 -Wall -o "$RUNNER_TEMP/d3d11probe.exe" \
            Tests/EngineSmoke/d3d11probe.c -ld3d11 -ldxgi -ldxguid -luuid

      - name: Engine smoke test (Wine under Rosetta, Direct3D 11 on each layer)
        env:
          SXB_ENGINE_SMOKE: "1"
          SXB_REQUIRE_RENDERING: "1" # DXMT must render a frame, even on the runner's virtual GPU
          SXB_RUNTIME_SOURCE: dist/SteamXBridge.app/Contents/Resources/Runtime
          SXB_D3D11_PROBE: ${{ runner.temp }}/d3d11probe.exe
        run: swift test --filter EngineSmokeTests

  # Tries candidate engines (runtime/candidates/*.json) with the same smoke
  # test, without shipping them. It never fails the build.
  engine-lab:
    runs-on: macos-26
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find candidates
        id: candidates
        run: |
          if compgen -G "runtime/candidates/*.json" >/dev/null; then echo "any=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build the probe and the tests
        if: steps.candidates.outputs.any == 'true'
        run: |
          brew install mingw-w64
          x86_64-w64-mingw32-gcc -O2 -Wall -o "$RUNNER_TEMP/d3d11probe.exe" \
            Tests/EngineSmoke/d3d11probe.c -ld3d11 -ldxgi -ldxguid -luuid
          swift build --build-tests

      - name: Smoke-test each candidate
        if: steps.candidates.outputs.any == 'true'
        run: |
          status=0
          for manifest in runtime/candidates/*.json; do
            name="$(basename "$manifest" .json)"
            echo "::group::$name"
            python3 -I scripts/stage_runtime.py "$PWD" "$RUNNER_TEMP/lab/$name" "$RUNNER_TEMP/lab-cache" "$manifest"
            SXB_ENGINE_SMOKE=1 SXB_REQUIRE_RENDERING=1 SXB_RUNTIME_SOURCE="$RUNNER_TEMP/lab/$name/Runtime" \
              SXB_D3D11_PROBE="$RUNNER_TEMP/d3d11probe.exe" swift test --skip-build --filter EngineSmokeTests || status=1
            echo "::endgroup::"
          done
          exit $status
