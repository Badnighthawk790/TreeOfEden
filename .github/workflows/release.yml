name: Release macOS app

# Release channel. Cut a release by pushing a version tag (e.g. v1.2.3), or run
# this workflow manually with a version. It builds and packages SteamXBridge.app
# on Apple Silicon and publishes a GitHub Release with the downloadable .app zip.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.3"
        required: true
        default: "1.0.0"

permissions:
  contents: write # required to create the GitHub Release

jobs:
  release:
    runs-on: macos-14 # Apple Silicon (arm64), same architecture as the M2 MacBook Air
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version and tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Package .app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package_macos_app.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SteamXBridge ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/SteamXBridge-macOS.zip
