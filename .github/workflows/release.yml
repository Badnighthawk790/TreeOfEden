name: Release macOS app

# Release channel.
# - Manual run (Actions > Release macOS app > Run workflow): builds the chosen
#   branch and creates a DRAFT release by default. Nothing is published, and
#   no tag is created, until someone reviews the draft and clicks Publish.
# - Pushing a version tag (v2.0.0): builds that tag and publishes directly.
# Either way the release is built from, and tagged at, the exact commit built.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 2.0.0"
        required: true
      draft:
        description: "Create as a draft to review before publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release halfway

jobs:
  release:
    runs-on: macos-26 # Apple Silicon
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Version must look like 2.0.0 (got '$VERSION')"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Package .app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/package_macos_app.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: SteamXBridge ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: false
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/SteamXBridge-macOS.zip
          fail_on_unmatched_files: true
